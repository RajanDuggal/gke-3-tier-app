apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: us-east1-docker.pkg.dev/project-f2bce33d-23f5-4831-9b4/three-tier-repo/backend:4219992c02191e8fe463f00c693e61d1daf5eada
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP   # This keeps the backend private, accessible only inside the cluster
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
