<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Tier App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            background-color: #e9ecef;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My GKE 3-Tier App</h1>
        <p id="status-message" class="status">Connecting to backend...</p>
    </div>

    <script>
        fetch('/api/')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('status-message').innerText = data;
                document.getElementById('status-message').style.backgroundColor = '#d4edda';
                document.getElementById('status-message').style.color = '#155724';
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('status-message').innerText = 'Failed to connect to backend: ' + error.message;
                document.getElementById('status-message').style.backgroundColor = '#f8d7da';
                document.getElementById('status-message').style.color = '#721c24';
            });
    </script>
</body>
</html>
